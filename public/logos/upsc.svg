<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="upscMaroon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <linearGradient id="upscGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Circular Seal Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#upscMaroon)" stroke="url(#upscGold)" stroke-width="3.5"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#FDE68A" stroke-width="1.2"/>
  
  <!-- Four Lions Capital Representation -->
  <g fill="url(#upscGold)">
    <!-- Base Lotus & Abacus -->
    <path d="M40 70 L80 70 L75 75 L45 75 Z"/>
    <circle cx="60" cy="72.5" r="2.2" fill="#881337"/>
    <circle cx="48" cy="72.5" r="1.5" fill="#881337"/>
    <circle cx="72" cy="72.5" r="1.5" fill="#881337"/>
    
    <!-- Center Lion -->
    <path d="M53 45 Q60 38 67 45 Q70 54 65 62 L60 67 L55 62 Q50 54 53 45 Z"/>
    <!-- Left Lion -->
    <path d="M44 49 Q48 43 53 47 L51 59 Q46 61 42 57 Q41 52 44 49 Z"/>
    <!-- Right Lion -->
    <path d="M76 49 Q72 43 67 47 L69 59 Q74 61 78 57 Q79 52 76 49 Z"/>
    <!-- Dharma Chakra Motif atop base -->
    <circle cx="60" cy="46" r="2" fill="#881337"/>
  </g>

  <!-- UPSC Text Badge -->
  <text x="60" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="2.5">UPSC</text>
  <text x="60" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="5" fill="#FDE68A" letter-spacing="0.6">UNION PUBLIC SERVICE COMM.</text>
  <!-- Satyameva Jayate Banner -->
  <text x="60" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4.5" fill="#FFFFFF" letter-spacing="0.4">सत्यमेव जयते</text>
</svg>

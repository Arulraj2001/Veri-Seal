<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gstSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="gstGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="gstBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="60" cy="60" r="56" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>

  <!-- Famous GST India Tricolor Looped Ribbon / Nodes Motif -->
  <g transform="translate(60, 48)">
    <!-- Top Arc (Saffron) -->
    <path d="M-22 0 C-22 -16 0 -22 14 -12 C24 -4 18 10 0 10 C-14 10 -22 0 -22 0 Z" fill="url(#gstSaffron)" opacity="0.9"/>
    <!-- Bottom Right Arc (Green) -->
    <path d="M0 10 C14 10 22 20 14 26 C4 32 -10 22 -14 12 C-18 2 0 10 0 10 Z" fill="url(#gstGreen)" opacity="0.9"/>
    <!-- Center Dynamic Ring (Blue) -->
    <circle cx="0" cy="0" r="8" fill="url(#gstBlue)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <!-- Growth Arrow -->
    <path d="M12 -12 L24 -24 M24 -24 L16 -24 M24 -24 L24 -16" stroke="url(#gstBlue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="60" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#0369A1" letter-spacing="3">GST</text>
  <rect x="20" y="90" width="80" height="11" rx="2" fill="#0369A1"/>
  <text x="60" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5" fill="#FFFFFF" letter-spacing="0.5">GOODS &amp; SERVICES TAX</text>
  <text x="60" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="4.5" fill="#15803D" letter-spacing="0.5">ONE NATION • ONE TAX</text>
</svg>

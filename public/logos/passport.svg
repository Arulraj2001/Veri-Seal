<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="passportGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="passportNavy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2042"/>
      <stop offset="100%" stop-color="#081026"/>
    </radialGradient>
  </defs>
  <!-- Deep Navy Blue Gold Ring Background -->
  <circle cx="60" cy="60" r="56" fill="url(#passportNavy)" stroke="url(#passportGold)" stroke-width="3"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#passportGold)" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Emblem Ashoka Lions Outline in Lustrous Gold -->
  <g fill="url(#passportGold)">
    <!-- Base Pedestal -->
    <rect x="42" y="76" width="36" height="5" rx="1"/>
    <rect x="38" y="81" width="44" height="4" rx="1.5"/>
    <circle cx="60" cy="78.5" r="2.5" fill="#081026"/>
    
    <!-- Central Lion Figure -->
    <path d="M54 44 C54 38 66 38 66 44 C68 46 68 50 67 54 C68 56 67 62 66 68 C64 74 62 76 60 76 C58 76 56 74 54 68 C53 62 52 56 53 54 C52 50 52 46 54 44 Z"/>
    
    <!-- Left Lion Figure -->
    <path d="M43 49 C41 45 48 41 51 45 C52 48 52 52 51 55 C52 59 50 64 48 70 C47 74 45 76 44 76 C43 73 42 66 41 62 C40 57 41 52 43 49 Z"/>
    
    <!-- Right Lion Figure -->
    <path d="M77 49 C79 45 72 41 69 45 C68 48 68 52 69 55 C68 59 70 64 72 70 C73 74 75 76 76 76 C77 73 78 66 79 62 C80 57 79 52 77 49 Z"/>
    
    <!-- Lion Head Details -->
    <circle cx="60" cy="40" r="5"/>
    <circle cx="47" cy="44" r="4"/>
    <circle cx="73" cy="44" r="4"/>
  </g>

  <!-- Arched Text Elements -->
  <text x="60" y="24" fill="#FFD700" font-size="8.5" font-family="'Inter', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.5">PASSPORT</text>
  <text x="60" y="32" fill="#FFE082" font-size="6" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">SEVA INDIA</text>
  <text x="60" y="99" fill="#FFD700" font-size="6.5" font-family="'Inter', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">MINISTRY OF EXT AFFAIRS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sscGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="sscBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Laurel / Circular Shield -->
  <circle cx="60" cy="60" r="56" fill="url(#sscBlue)" stroke="url(#sscGold)" stroke-width="3"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Ashoka Lions Emblem representation -->
  <g fill="url(#sscGold)">
    <!-- Base Abacus -->
    <rect x="42" y="65" width="36" height="5" rx="1.5"/>
    <circle cx="60" cy="67.5" r="2" fill="#1E3A8A"/>
    <circle cx="50" cy="67.5" r="1.5" fill="#1E3A8A"/>
    <circle cx="70" cy="67.5" r="1.5" fill="#1E3A8A"/>
    
    <!-- Central Lion Crown & Face -->
    <path d="M54 44 Q60 38 66 44 Q69 52 64 58 L60 62 L56 58 Q51 52 54 44 Z"/>
    <!-- Left Lion Profile -->
    <path d="M46 48 Q50 43 54 46 L53 56 Q48 57 44 54 Q43 50 46 48 Z"/>
    <!-- Right Lion Profile -->
    <path d="M74 48 Q70 43 66 46 L67 56 Q72 57 76 54 Q77 50 74 48 Z"/>
    <!-- Manes and accents -->
    <circle cx="60" cy="46" r="2" fill="#1E3A8A"/>
    <circle cx="50" cy="49" r="1.2" fill="#1E3A8A"/>
    <circle cx="70" cy="49" r="1.2" fill="#1E3A8A"/>
    
    <!-- Laurel Leaves Border -->
    <path d="M26 62 C26 44 38 30 60 25 C82 30 94 44 94 62 C94 80 80 94 60 97 C40 94 26 80 26 62 Z" fill="none" stroke="url(#sscGold)" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Central Initials -->
  <text x="60" y="81" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="3">SSC</text>
  <!-- Full Text Arc / Banner -->
  <rect x="25" y="86" width="70" height="12" rx="3" fill="#B45309"/>
  <text x="60" y="94.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5.5" fill="#FFFFFF" letter-spacing="0.8">STAFF SELECTION COMM.</text>
  <text x="60" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4.5" fill="#FCD34D" letter-spacing="0.5">GOVERNMENT OF INDIA</text>
</svg>

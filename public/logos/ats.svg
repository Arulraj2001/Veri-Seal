<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="atsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="atsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="atsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2"/>
  
  <!-- Document Container -->
  <rect x="30" y="24" width="60" height="74" rx="6" fill="#FFFFFF" stroke="url(#atsGrad)" stroke-width="3" filter="url(#atsGlow)"/>
  
  <!-- Resume Layout Lines -->
  <line x1="40" y1="36" x2="62" y2="36" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="40" y1="45" x2="80" y2="45" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="53" x2="74" y2="53" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="60" x2="78" y2="60" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="67" x2="68" y2="67" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  
  <!-- ATS 99+ Gold Badge -->
  <circle cx="76" cy="78" r="19" fill="url(#atsGold)" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M70 78 L74 82 L83 73" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Badge Header Text -->
  <text x="60" y="108" fill="#0369A1" font-size="7.5" font-family="'Inter', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">ATS VERIFIED</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ibpsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="ibpsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Outer Shield / Circle -->
  <circle cx="60" cy="60" r="56" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
  <circle cx="60" cy="60" r="50" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>

  <!-- IBPS Interlocking Dynamic Leaves / Hexagonal Graphic -->
  <g transform="translate(60, 50)">
    <!-- Top-Right Leaf -->
    <path d="M0 -22 C14 -22 22 -14 22 0 C10 0 0 -10 0 -22 Z" fill="url(#ibpsBlue)"/>
    <!-- Bottom-Left Leaf -->
    <path d="M0 22 C-14 22 -22 14 -22 0 C-10 0 0 10 0 22 Z" fill="url(#ibpsGreen)"/>
    <!-- Top-Left Leaf -->
    <path d="M-22 0 C-22 -14 -14 -22 0 -22 C0 -10 -10 0 -22 0 Z" fill="url(#ibpsGreen)"/>
    <!-- Bottom-Right Leaf -->
    <path d="M22 0 C22 14 14 22 0 22 C0 10 10 0 22 0 Z" fill="url(#ibpsBlue)"/>
    <!-- Core Ring -->
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  </g>

  <!-- Typography -->
  <text x="60" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#0F172A" letter-spacing="2">IBPS</text>
  <rect x="20" y="89" width="80" height="11" rx="2.5" fill="#15803D"/>
  <text x="60" y="97" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5" fill="#FFFFFF" letter-spacing="0.5">INSTITUTE OF BANKING</text>
  <text x="60" y="107" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4.5" fill="#0284C7" letter-spacing="0.4">PERSONNEL SELECTION</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pariGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="roadGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="60" cy="60" r="54" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#pariGrad)" stroke-width="2"/>

  <!-- Steering Wheel & Highway Symbol -->
  <g fill="none" stroke="url(#pariGrad)" stroke-width="3.5" stroke-linecap="round">
    <!-- Outer Steering Wheel -->
    <circle cx="60" cy="56" r="24"/>
    <!-- Center Hub -->
    <circle cx="60" cy="56" r="6" fill="#0369A1"/>
    <!-- Spokes -->
    <line x1="36" y1="56" x2="54" y2="56"/>
    <line x1="84" y1="56" x2="66" y2="56"/>
    <line x1="60" y1="62" x2="60" y2="80"/>
  </g>

  <!-- Highway Road Perspective Triangle -->
  <polygon points="52,80 68,80 63,60 57,60" fill="url(#roadGreen)"/>
  <line x1="60" y1="62" x2="60" y2="78" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Typography -->
  <text x="60" y="24" fill="#0369A1" font-size="8.5" font-family="'Inter', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">PARIVAHAN</text>
  <text x="60" y="101" fill="#15803D" font-size="6.5" font-family="'Inter', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">SARATHI • MoRTH RTO</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="itNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="itGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Circular Shield -->
  <circle cx="60" cy="60" r="56" fill="url(#itNavy)" stroke="url(#itGold)" stroke-width="3"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#FCD34D" stroke-width="1.2" stroke-dasharray="3,2"/>
  
  <!-- Scales of Justice / Indian Ashoka Stambh Motif -->
  <g fill="url(#itGold)">
    <!-- Balance Beam Scale -->
    <rect x="42" y="44" width="36" height="3" rx="1.5"/>
    <circle cx="60" cy="45.5" r="2.5" fill="#1E3A8A"/>
    <line x1="60" y1="45" x2="60" y2="68" stroke="url(#itGold)" stroke-width="2.5"/>
    
    <!-- Left Pan -->
    <path d="M42 46 L38 54 L46 54 Z" fill="none" stroke="url(#itGold)" stroke-width="1"/>
    <path d="M35 54 Q42 60 49 54 Z"/>
    
    <!-- Right Pan -->
    <path d="M78 46 L74 54 L82 54 Z" fill="none" stroke="url(#itGold)" stroke-width="1"/>
    <path d="M71 54 Q78 60 85 54 Z"/>
    
    <!-- Base -->
    <rect x="50" y="68" width="20" height="4" rx="1.5"/>
    <rect x="44" y="72" width="32" height="3" rx="1"/>
  </g>

  <!-- Typography -->
  <text x="60" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" letter-spacing="1">INCOME TAX</text>
  <rect x="25" y="90" width="70" height="11" rx="2.5" fill="#D97706"/>
  <text x="60" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5" fill="#FFFFFF" letter-spacing="0.5">आयाकार विभाग • GOVT OF INDIA</text>
  <text x="60" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5" fill="#FCD34D" letter-spacing="1">PAN &amp; TAX SERVICES</text>
</svg>

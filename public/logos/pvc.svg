<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pvcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <!-- CR-80 Proportion Smart Card Outer Shape -->
  <rect x="14" y="24" width="92" height="62" rx="8" fill="url(#pvcGrad)" stroke="#6366F1" stroke-width="2"/>
  
  <!-- Subtle Holographic Security Wave -->
  <path d="M14 62 Q 40 45, 65 65 T 106 50 L 106 80 Q 80 86, 60 72 T 14 80 Z" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Golden Contact Microchip -->
  <rect x="25" y="38" width="20" height="17" rx="3" fill="url(#chipGold)" stroke="#A16207" stroke-width="0.8"/>
  <line x1="25" y1="46.5" x2="45" y2="46.5" stroke="#854D0E" stroke-width="0.7"/>
  <line x1="35" y1="38" x2="35" y2="55" stroke="#854D0E" stroke-width="0.7"/>
  <circle cx="35" cy="46.5" r="2.5" fill="none" stroke="#854D0E" stroke-width="0.7"/>

  <!-- Contactless NFC Wireless Arcs -->
  <g fill="none" stroke="#E0E7FF" stroke-width="1.8" stroke-linecap="round">
    <path d="M52 42 A 6 6 0 0 1 52 50"/>
    <path d="M56 39 A 11 11 0 0 1 56 53"/>
    <path d="M60 36 A 16 16 0 0 1 60 56"/>
  </g>

  <!-- Photo Box Placeholder -->
  <rect x="76" y="34" width="22" height="26" rx="2.5" fill="#EEF2FF" fill-opacity="0.25" stroke="#C7D2FE" stroke-width="1.2"/>
  <circle cx="87" cy="42" r="4.5" fill="#E0E7FF"/>
  <path d="M80 56 C80 50, 94 50, 94 56" fill="#E0E7FF"/>

  <!-- Card Number & Text Details -->
  <text x="25" y="73" fill="#F8FAFC" font-size="6.5" font-family="'Courier New', monospace" font-weight="bold" letter-spacing="1">CR-80 SMART ID</text>
  <text x="60" y="103" fill="#4F46E5" font-size="8" font-family="'Inter', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.2">PVC CARD LAB</text>
</svg>

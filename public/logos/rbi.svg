<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rbiBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rbiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Seal Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#rbiBlue)" stroke="url(#rbiGold)" stroke-width="3"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#FCD34D" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Iconic RBI Palm Tree & Bengal Tiger Silhouette -->
  <g fill="url(#rbiGold)">
    <!-- Palm Tree Fronds -->
    <path d="M60 48 L60 30"/>
    <path d="M60 30 Q50 20 40 28 Q50 32 60 34"/>
    <path d="M60 30 Q70 20 80 28 Q70 32 60 34"/>
    <path d="M60 30 Q46 28 42 36 Q52 38 60 36"/>
    <path d="M60 30 Q74 28 78 36 Q68 38 60 36"/>
    <path d="M60 30 Q54 18 60 16 Q66 18 60 30"/>
    <!-- Trunk -->
    <path d="M58 32 L57 58 L63 58 L62 32 Z"/>
    
    <!-- Royal Bengal Tiger Silhouette -->
    <!-- Head & Ears -->
    <path d="M38 52 Q40 48 43 51 Q46 54 44 58 L36 58 Z"/>
    <!-- Body & Legs -->
    <path d="M42 54 Q50 50 62 52 Q68 53 74 58 L72 65 L66 65 L65 59 L52 59 L50 65 L44 65 Z"/>
    <!-- Tail curved upward -->
    <path d="M73 57 Q78 52 79 46 Q82 48 76 59 Z"/>
  </g>

  <!-- Typography -->
  <text x="60" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="2">RBI</text>
  <rect x="22" y="87" width="76" height="11" rx="2" fill="#B45309"/>
  <text x="60" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5" fill="#FFFFFF" letter-spacing="0.6">RESERVE BANK OF INDIA</text>
  <text x="60" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4.5" fill="#FCD34D" letter-spacing="0.5">IFSC &amp; BANKING GATEWAY</text>
</svg>

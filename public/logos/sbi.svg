<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sbiBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="40%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="60" cy="60" r="56" fill="#FFFFFF" stroke="#0077B6" stroke-width="2"/>
  <!-- Famous SBI Blue Circle -->
  <circle cx="60" cy="50" r="32" fill="url(#sbiBlue)"/>
  <!-- Iconic Keyhole cutout (Kankaria Lake / Security shape) -->
  <circle cx="60" cy="50" r="10" fill="#FFFFFF"/>
  <rect x="56" y="50" width="8" height="32" fill="#FFFFFF"/>
  
  <!-- Text Label -->
  <text x="60" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#023E8A" letter-spacing="1.5">SBI</text>
  <text x="60" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5" fill="#0077B6" letter-spacing="0.5">STATE BANK OF INDIA</text>
</svg>
